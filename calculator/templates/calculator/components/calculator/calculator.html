{% load static %}
<script type="module" src="{% static 'js/components/calculator/calculator.js' %}"></script>

<div id="calculator-page" class="relative select-none">
    <svg class="w-full h-full rounded-2xl bg-white shadow-xl border border-gray-400">
    </svg>
    <div class="absolute top-0 left-0 w-full h-full p-2 pointer-events-none">
        <!-- Overlay -->
        <details class="bg-gray-100 border border-gray-300 w-min rounded-lg shadow-lg pointer-events-auto" open>
            <summary class="cursor-pointer pt-1 pb-1 pl-2 pr-2 border-b border-gray-300 whitespace-nowrap">Outils</summary>
            <div class="grid">
                {% include 'calculator/snippets/basic-button.html' with icon='add' text='Ajouter un bloc' id='add-node-button' %}
                {% include 'calculator/snippets/basic-button.html' with icon='refresh' text='Réinitialiser la vue' id='reset-view-button' %}
            </div>
        </details>
    </div>
</div>
